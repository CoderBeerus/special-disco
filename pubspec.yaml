name: aniweb
description: Private Android-first media browser with performant playback and downloads.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  flutter_inappwebview: ^6.1.5
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  background_downloader: ^8.7.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  flutter_displaymode: ^0.6.0
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  wakelock_plus: ^1.2.8
  screen_brightness: ^2.1.7
  volume_controller: ^3.3.0
  uuid: ^4.6.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/blocklists/

flutter_native_splash:
  color: "#1e1e1e"
  android_12:
    color: "#1e1e1e"

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
